name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  full:
    # Everything, including the tinydelta integration.
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with the tinydelta extra
        run: python -m pip install -e ".[dev,delta]"

      # tests/test_delta.py uses importorskip, so a failed tinydelta install
      # would quietly skip eight tests and still report green. Fail loudly.
      - name: Require tinydelta
        run: python -c "import tinydelta"

      - name: Run tests
        run: python -m pytest -q -rs

  no-optional-deps:
    # The README promises the CSV path needs nothing beyond the standard
    # library. Prove it on every change rather than taking it on trust.
    name: No optional dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install without extras
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q -rs

      - name: Run a query from the command line
        run: python -m tinyquery --analyze "SELECT region FROM orders WHERE year = 2024"
